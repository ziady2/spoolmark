[tox]
envlist = py39,py310,py311,py312,py313,lint

[testenv]
extras = dev
commands = python -m pytest -q --cov=subcue --cov-report=term-missing --cov-fail-under=95

[testenv:lint]
basepython = python3.13
commands =
    python -m ruff check src tests examples scripts
    python -m ruff format --check src tests examples scripts
